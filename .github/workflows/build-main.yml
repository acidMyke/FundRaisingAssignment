name: Build

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore
      - name: Format check
        run: dotnet format --verify-no-changes --verbosity normal
      - name: Build
        run: dotnet build --no-restore
      - name: Migration check
        run: dotnet ef migrations has-pending-model-changes
        working-directory: ./FundRaisingAssignment.Application
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRINGS }}
      - name: Test
        run: dotnet test --no-build --verbosity normal
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRINGS }}
      - name: Publish Test Result
        uses: dorny/test-reporter@v3.0.0
        if: always()
        with:
          name: .NET Tests
          path: "**/test-results.trx"
          reporter: dotnet-trx
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Container
        working-directory: ./FundRaisingAssignment.Application
        run: dotnet publish --no-build --verbosity normal --os linux --arch x64 /t:PublishContainer -p ContainerRegistry=ghcr.io
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    needs: build
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 1. Navigate to your deployment folder
            cd ~/app/fundraising

            # 2. Authenticate with GHCR (ensures the runner has access to pull)
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # 3. Pull the absolute newest image you just pushed
            docker compose pull

            # 4. Recreate and start the container in the background
            docker compose up -d